<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#1B3B17"/>
    </linearGradient>
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="50%" stop-color="#7B563D"/>
      <stop offset="100%" stop-color="#4A3328"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular aura -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.04"/>

  <!-- Soil / Mound Base -->
  <ellipse cx="256" cy="425" rx="140" ry="24" fill="#422e1b"/>
  
  <!-- Trunk -->
  <path d="M 236 425 L 244 260 L 268 260 L 276 425 Z" fill="url(#trunkGrad)"/>
  <path d="M 240 380 Q 256 370 272 380" stroke="#3d2a1f" stroke-width="4" fill="none"/>
  <path d="M 242 340 Q 256 330 270 340" stroke="#3d2a1f" stroke-width="4" fill="none"/>
  <path d="M 243 300 Q 256 290 269 300" stroke="#3d2a1f" stroke-width="4" fill="none"/>

  <!-- Palm TBS Fruit Bunches (Orange-Gold Sawit) -->
  <ellipse cx="238" cy="265" rx="20" ry="26" fill="url(#fruitGrad)"/>
  <ellipse cx="274" cy="265" rx="20" ry="26" fill="url(#fruitGrad)"/>
  <ellipse cx="256" cy="275" rx="22" ry="24" fill="#E65100"/>
  <circle cx="248" cy="268" r="4" fill="#FFD54F"/>
  <circle cx="264" cy="268" r="4" fill="#FFD54F"/>
  <circle cx="256" cy="282" r="4" fill="#FFD54F"/>

  <!-- Palm Fronds / Leaves -->
  <!-- Top Center -->
  <path d="M 256 260 C 256 160 256 100 256 90 C 265 140 260 210 256 260 Z" fill="url(#leafGrad)"/>
  <!-- Left Arch High -->
  <path d="M 256 260 C 220 170 160 120 100 130 C 140 180 200 220 256 260 Z" fill="url(#leafGrad)"/>
  <!-- Right Arch High -->
  <path d="M 256 260 C 292 170 352 120 412 130 C 372 180 312 220 256 260 Z" fill="url(#leafGrad)"/>
  <!-- Left Arch Mid -->
  <path d="M 256 260 C 200 200 130 180 70 210 C 120 230 190 250 256 260 Z" fill="url(#leafGrad)"/>
  <!-- Right Arch Mid -->
  <path d="M 256 260 C 312 200 382 180 442 210 C 392 230 322 250 256 260 Z" fill="url(#leafGrad)"/>
  <!-- Left Arch Low -->
  <path d="M 256 260 C 210 240 150 250 90 290 C 140 290 200 280 256 260 Z" fill="#2E7D32"/>
  <!-- Right Arch Low -->
  <path d="M 256 260 C 302 240 362 250 422 290 C 372 290 312 280 256 260 Z" fill="#2E7D32"/>

  <!-- Golden Ring Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFC107" stroke-width="4" opacity="0.3"/>
</svg>
